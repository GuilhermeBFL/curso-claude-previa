<style>
:root {
  --k-topo-fundo:#080b22; --k-topo-texto:#fff3da; --k-acento:#ff9f2e; --k-acento-texto:#1f0f00;

  --k-leitura-fundo-noite:#0e1130; --k-leitura-texto-noite:#eff0fb; --k-leitura-caixa-noite:#1c2148;
  --espaco:#050716; --creme:#fff3da; --cor-foco:#ff9f2e;
}
html, body { margin:0; background:var(--espaco); color:var(--creme); font-family:var(--k-texto); -webkit-text-size-adjust:100%; }
button { font-family:inherit; }
.k-veu { background:linear-gradient(90deg, transparent 38%, #02041299); }
.k-painel { box-shadow:-30px 0 80px #000a; border-left:3px solid var(--cor-foco); }
.k-aulas { overscroll-behavior:contain; }
.k-aula :focus-visible { outline-color:#b3480a; }
html[data-leitura="noite"] .k-aula :focus-visible { outline-color:#ff9f2e; }
.k-termo { border-bottom-color:#c9590c; }
html[data-leitura="noite"] .k-termo { border-bottom-color:#ff9f2e; }

/* Céu: três camadas de estrelas, movidas por transform */
.ceu { position:fixed; inset:0; z-index:0; overflow:hidden; background:radial-gradient(120% 90% at 55% 45%, #0d1136, #050716 70%); }
.ceu canvas { position:absolute; left:0; top:0; will-change:transform; }

html.sistema, html.sistema body { height:100%; overflow:hidden; }
#palco { position:fixed; inset:0; z-index:1; width:100%; height:100%; pointer-events:none; }
#astros { position:fixed; inset:0; z-index:2; pointer-events:none; list-style:none; margin:0; padding:0; overflow:hidden; }
#astros li { display:contents; }
.alvo { position:absolute; left:0; top:0; padding:0; border:0; border-radius:50%; background:transparent; cursor:pointer; pointer-events:auto; }
.rotulo { position:absolute; left:0; top:0; display:flex; align-items:center; gap:7px; height:30px; padding:0 12px 0 5px; box-sizing:border-box; border-radius:15px; background:#070a20f0; border:1px solid #ffffff38; color:#fff3da; font:700 14px/1 var(--k-texto); white-space:nowrap; cursor:pointer; pointer-events:auto; user-select:none; opacity:0; transition:opacity .45s, background-color .18s, color .18s, box-shadow .18s; }

.rotulo .num { display:grid; place-items:center; min-width:21px; height:21px; padding:0 2px; box-sizing:border-box; border-radius:11px; background:var(--cor); color:#080b22; font-size:12.5px; font-variant-numeric:tabular-nums; }
.rotulo svg { width:13px; height:13px; flex:none; margin-left:-2px; color:#ffe08a; }
.visivel .rotulo { opacity:1; }
.rotulo.futuro { color:#dfe2f6; background:#070a20e6; border-color:#ffffff22; }
.rotulo.futuro .num { background:#c9cde8; }
.rotulo.feito { border-color:#ffe08a80; }
.rotulo.atual { background:var(--k-acento); color:var(--k-acento-texto); border-color:#ffe0ad; font-size:15px; box-shadow:0 0 22px #ff9f2e88; }
.rotulo.atual .num { background:#1f0f00; color:#ffd9a0; }
.rotulo.quente { background:#fff3da; color:#14102c; border-color:#fff; box-shadow:0 0 26px #fff3da99; }
.rotulo.quente .num { background:#14102c; color:#fff3da; }
.rotulo.quente svg { color:#a8660a; }

html.compacto .rotulo::after { inset:-9px 0; }
html.compacto .rotulo.atual { font-size:13.5px; }
html.compacto .rotulo .num { min-width:19px; height:19px; font-size:12px; }
html.compacto .chamada { width:auto; }
html.compacto .chamada p { position:fixed; right:22px; bottom:96px; width:230px; margin:0; font-size:16px; line-height:1.28; text-align:right; }
html.compacto .continuar { font-size:15px; min-height:44px; padding:4px 16px 4px 10px; }

.titulo { position:fixed; left:0; top:0; z-index:3; margin:0; width:170px; text-align:center; color:#3a0f00; font:400 30px/1.02 var(--k-titulo); pointer-events:none; opacity:0; transition:opacity .4s; text-shadow:0 1px 0 #ffe9a866; }

.chamada p { margin:0 0 13px; font-size:18.5px; line-height:1.32; text-shadow:0 1px 10px #050716, 0 0 3px #050716; }
.chamada p b { color:#ffc56b; font-weight:700; }
.continuar { display:inline-flex; align-items:center; gap:9px; min-height:48px; padding:6px 18px 6px 12px; border:0; border-radius:26px; background:var(--k-acento); color:var(--k-acento-texto); font:700 16px/1.18 var(--k-texto); text-align:left; white-space:nowrap; cursor:pointer; box-shadow:0 8px 28px #ff9f2e55, inset 0 -3px 0 #c8680e; transition:transform .15s, box-shadow .15s; }

.continuar svg { width:27px; height:27px; flex:none; }

.chave i { display:block; width:14px; height:14px; flex:none; border-radius:50%; }

html.foco .viagem { padding-bottom:80vh; }
.heroi { position:relative; text-align:center; padding:0 18px; }
.heroi canvas { pointer-events:none; }
.heroi .titulo { position:absolute; left:50%; top:0; opacity:1; transition:none; }
.heroi .continuar { margin-bottom:6px; white-space:normal; max-width:100%; box-sizing:border-box; }
html.foco .parada:not(.mira) canvas { opacity:.22; }
html.em-voo .chamada, html.em-voo .chave { opacity:0; pointer-events:none; }
.chamada, .chave { transition:opacity .3s; }
.heroi p { margin:0 auto 14px; max-width:340px; font-size:19px; line-height:1.32; text-shadow:0 1px 10px #050716; position:relative; }
.heroi p b { color:#ffc56b; }
.heroi .continuar { position:relative; font-size:16.5px; }
.trilha { position:absolute; left:0; top:0; pointer-events:none; }
.faixa { position:absolute; left:0; right:0; margin:0; text-align:center; color:#ffc56b; font:400 21px/1.2 var(--k-titulo); text-shadow:0 0 12px #050716, 0 1px 3px #050716; }
.paradas { list-style:none; margin:0; padding:0; }
.parada { position:absolute; left:0; width:100%; }

.parada button { position:absolute; inset:0; width:100%; padding:0; border:0; background:transparent; color:var(--creme); cursor:pointer; -webkit-tap-highlight-color:transparent; }

.selo.feito { background:#ffe08a; color:#2b1a00; }
.selo.atual { background:var(--k-acento); color:var(--k-acento-texto); box-shadow:0 0 18px #ff9f2e88; }
.parada.futuro .nome b { color:#e6e7f6; }
html.foco .parada .nome { opacity:0; }

@media (prefers-reduced-motion: reduce) {
  .rotulo, .titulo, .parada canvas, .parada .nome, .continuar { transition:none; }
  .continuar:hover svg { animation:none; }
  .continuar:hover { transform:none; }
}
</style>

      mira?.li.classList.remove('mira'); mira = par[n]; mira.li.classList.add('mira');
      const faixa = innerWidth > 980 ? H - topo : H * .31 - topo;
      animarScroll(mira.cy + vg.offsetTop - (topo + faixa * .5));
    } else {
      mira?.li.classList.remove('mira'); mira = null;
      animarScroll(scrollSalvo, () => raiz.classList.remove('foco'));
    }
  }
  function quadro(t, dt) {
    if (calmo) t = 100;
    if (animS) animS(performance.now());
    if (fila.length) resta = 6;
    processarFila(5);
    moverCeu(0, -scrollY * .12, 1);
    if (t > proxCometa || cometas.length) {
      if (!calmo) { cp.setTransform(dpr, 0, 0, dpr, 0, 0); cp.clearRect(0, 0, W, H); pintaCometas(cp, dt, t, W, H); limpo = false; }
    } else if (!limpo) { cp.setTransform(dpr, 0, 0, dpr, 0, 0); cp.clearRect(0, 0, W, H); limpo = true; }
    if (calmo && !sujo && resta <= 0) return;
    sujo = false; resta--;
    if (solVis) {
      pintarSprite(ESTRELA, ESTRELA.Dn, t);
      cs.setTransform(dpr, 0, 0, dpr, 0, 0); cs.clearRect(0, 0, solW, solH);
      pintaEstrela(cs, solW / 2, solH / 2, Rsol, t, 1, 2.7);
    }
    const vis = par.filter(o => o.vis);
    for (const o of calmo ? vis : []) { pintarSprite(o.p, o.D, t); if (o.p.par) pintarSprite(COMPANHEIRO, 250, t); }
    if (vis.length) { const a = vis[turno++ % vis.length]; pintarSprite(a.p, a.D, t); if (a.p.par) pintarSprite(COMPANHEIRO, 250, t); }
    for (const o of vis) {
      if (!o.p.spr && o.p.tex) pintarSprite(o.p, o.D, t);
      if (o.p.par && !COMPANHEIRO.spr && COMPANHEIRO.tex) pintarSprite(COMPANHEIRO, 250, t);
      const c = o.c, S = o.S; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, S, S);
      pintaPlaneta(c, o.p, S / 2, S / 2, o.r, o.ang, t, { apagar: o.p.est === 'futuro' ? .7 : 0, quente: false, nave: Lnave, vocePx: 15.5 });
    }
  }
  medir();
  pedirTextura(ESTRELA, 512, true);
  obs.observe(sol);
  par.forEach(o => obs.observe(o.cv));
  return {
    medir, quadro, voar, fontes: () => medir(),
    desmontar() { obs.disconnect(); naveK = 1.02; ajustarLuas(false); document.documentElement.classList.remove('foco'); ceuEl?.remove(); ceuEl = null; }
  };
}

/* Partida */
let atual = null, modoAtual = null, larguraAnt = 0;
function escolher() {
  const m = innerWidth >= 1180 && innerHeight >= 620 ? 'sistema' : 'viagem';
  if (m !== modoAtual) { atual?.desmontar(); modoAtual = m; atual = m === 'sistema' ? criarSistema() : criarViagem(); }
  else if (m === 'sistema' || innerWidth !== larguraAnt) atual.medir();
  larguraAnt = innerWidth;
}
escolher();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(escolher, 160); });
document.addEventListener('k-modulo', e => { document.documentElement.style.setProperty('--cor-foco', PLANETAS[e.detail].cor); atual.voar(e.detail); });
document.addEventListener('k-fechar', () => atual.voar(null));
document.addEventListener('k-noite', e => { atual.noite?.(e.detail); if (!document.querySelector('.k-aula.on')) Kit.aviso(e.detail ? 'As aulas agora abrem no modo noite.' : 'As aulas agora abrem no modo dia.'); });
document.fonts?.ready.then(() => atual.fontes?.());
const aula = () => document.querySelector('.k-aula.on');
let antes = performance.now();
function laco(ms) {
  requestAnimationFrame(laco);
  const t = ms / 1000, dt = Math.min(.05, Math.max(0, ms - antes) / 1000);
  antes = ms;
  if (aula()) return;
  atual.quadro(t, dt);
}
requestAnimationFrame(laco);
})();
</script>
