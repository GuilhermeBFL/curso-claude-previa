<!doctype html>
<html lang="pt-BR" data-leitura="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Do zero ao agente: célula viva</title>
<meta name="theme-color" content="#04030b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2304030b' stroke='%23c9ff3a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff3db8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..800,0..100,0..1;1,9..144,400..800,0..100,0..1&family=Shantell+Sans:wght@500;700&display=swap">
<style>
:root{
  --k-topo-fundo:#0a0818; --k-topo-texto:#f2effa; --k-acento:#c9ff3a; --k-acento-texto:#10140a;
  --k-painel-fundo:#100d24; --k-painel-texto:#f2effa; --k-linha:#ffffff26;
  --k-titulo:'Fraunces',Georgia,'Times New Roman',serif; --k-texto:'Atkinson Hyperlegible Next',system-ui,sans-serif; --k-raio:14px;
  --k-leitura-fundo:#f8f7fc; --k-leitura-texto:#1c1832; --k-leitura-caixa:#ece9f6;
  --k-leitura-fundo-noite:#0f0d1e; --k-leitura-texto-noite:#ece9f7; --k-leitura-caixa-noite:#1d1a36;
  --lim:#c9ff3a; --pale:#bcb9d8;
}
*{box-sizing:border-box}
html{background:#04030b;color:#f2effa;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--k-texto);overflow-x:hidden}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#tela{position:fixed;left:0;top:0;width:100%;height:100vh;z-index:-1;display:block}
#palco{position:relative;min-height:100vh;overflow:hidden}
html:not(.alto) #palco{height:100vh;overflow:hidden}

/* Abertura */
.abertura{position:absolute;left:var(--mx,24px);top:calc(var(--k-topo-h) + var(--ax,14px));z-index:2}
.abertura h1{margin:0;font:italic 600 var(--h1,56px)/.98 var(--k-titulo);font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;letter-spacing:-.018em;color:#fff;text-shadow:0 0 34px #a97bff88;white-space:nowrap}
.corpo{width:var(--bloco,230px);margin-top:10px}
.corpo p{margin:0 0 12px;font-size:var(--fr,16px);line-height:1.34;color:#d8d5ec}
#continuar{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:9px 16px 9px 12px;background:var(--lim);color:var(--k-acento-texto);font:700 var(--fb,15.5px)/1.2 var(--k-texto);text-align:left;border:0;border-radius:24px 20px 26px 18px/22px 26px 18px 24px;cursor:pointer;box-shadow:0 0 30px #c9ff3a59,inset 0 -2px 0 #0000002e;transition:transform .18s,box-shadow .18s,border-radius .4s}
#continuar:hover{transform:translateY(-2px);box-shadow:0 0 44px #c9ff3a99,inset 0 -2px 0 #0000002e;border-radius:20px 26px 18px 26px/26px 20px 26px 18px}
#continuar i{flex:none;width:14px;height:14px;border-radius:50%;background:#10140a;box-shadow:0 0 0 3px #10140a33;animation:bate 2.6s ease-in-out infinite}
@keyframes bate{50%{transform:scale(.7);box-shadow:0 0 0 7px #10140a14}}
.dica{position:absolute;right:20px;bottom:78px;width:13.6em;margin:0;text-align:right;font-size:clamp(14px,calc(var(--fe,15px)*.94),18px);line-height:1.3;color:var(--pale)}

/* Plaquinha: lâmina de vidro com a ponta fosca e uma placa de 18 poços */
.bancada{display:contents}
.plaquinha{position:absolute;left:var(--mx,24px);bottom:76px;z-index:56;display:flex;width:252px;height:70px;border-radius:5px;overflow:hidden;transform:scale(var(--pe,1)) rotate(-1.3deg);transform-origin:0 100%;background:linear-gradient(112deg,#ffffff24 0%,#ffffff08 24%,#ffffff17 46%,#ffffff06 100%);box-shadow:inset 0 0 0 1px #ffffff33,inset 0 1px 0 #ffffff66,0 10px 30px #000b;padding:0;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:opacity .6s,filter .18s}
.plaquinha:hover{filter:brightness(1.12)}
.fosco{flex:0 0 136px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 9px;background:#efecf7;color:#17132e;font-family:'Shantell Sans','Comic Sans MS',var(--k-texto);font-size:13.5px;line-height:1.16}
.fosco strong{font-size:15.5px;font-weight:700;white-space:nowrap}
.fosco b{font-weight:700;font-variant-numeric:tabular-nums}
.pocos{flex:1;background:linear-gradient(112deg,#17143a,#0b0920);display:grid;grid-template-columns:repeat(6,1fr);align-content:center;justify-items:center;gap:4px 1px;padding:0 7px}
.pocos,.fosco{height:100%}
.pocos i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px #ffffff5c}
.pocos i.feito{background:var(--c);box-shadow:0 0 7px var(--c)}
.pocos i.atual{background:var(--c);box-shadow:0 0 9px var(--c);animation:bate2 1.7s ease-in-out infinite}
.pocos i.olhando{outline:1.5px solid #fff;outline-offset:1px}
@keyframes bate2{50%{transform:scale(1.28);box-shadow:0 0 15px var(--c)}}

/* Rótulos e alvos */
#lista{list-style:none;margin:0;padding:0;position:absolute;inset:0;z-index:1;pointer-events:none}
.alvo{position:absolute;padding:0;border:0;background:transparent;border-radius:50%;cursor:pointer;pointer-events:auto}
.rot{position:absolute;display:flex;align-items:center;gap:8px;min-height:44px;padding:3px 8px 3px 0;color:var(--pale);font:500 var(--fe,15px)/1.14 var(--k-texto);text-align:left;background:transparent;border:0;border-radius:22px;cursor:pointer;pointer-events:auto;transform:translateY(-50%);white-space:nowrap;opacity:0;transition:opacity .5s calc(var(--i)*36ms)}
html.pronto .rot{opacity:1}
html.solto .rot{transition:opacity .28s,color .18s,background-color .18s,box-shadow .18s,transform .18s}
.rot .num{flex:none;display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:52% 48% 55% 45%/48% 55% 45% 52%;font:italic 600 1em/1 var(--k-titulo);font-variation-settings:"SOFT" 100,"opsz" 20;box-shadow:inset 0 0 0 1.3px currentColor;transition:box-shadow .18s,color .18s,background-color .18s}
.rot.esq{flex-direction:row-reverse;text-align:right;padding:3px 0 3px 8px}
.rot .nome{display:block}
.rot.feito{color:#fff}
.rot.feito .num{background:var(--c);color:#07060f;box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent)}
.rot.feito .nome::after{content:"";display:inline-block;width:8px;height:4.5px;margin-left:7px;border-left:2px solid var(--c);border-bottom:2px solid var(--c);transform:rotate(-45deg) translate(1px,-3px)}
.rot.atual{padding:5px 15px 5px 5px;color:#10140a;background:var(--lim);font-weight:700;box-shadow:0 0 26px #c9ff3a73;animation:brilha 2.4s ease-in-out infinite}
.rot.atual .num{background:#10140a;color:var(--lim);box-shadow:none}
.rot.atual em{display:block;font:italic 500 .84em/1.1 var(--k-texto);opacity:.82}
@keyframes brilha{50%{box-shadow:0 0 44px #c9ff3ab3}}
.rot.futuro:hover .num,.rot.futuro.on .num{color:var(--c);box-shadow:inset 0 0 0 1.6px var(--c),0 0 10px var(--c)}
.rot:hover,.rot.on{color:#fff}
.rot.atual:hover,.rot.atual.on{color:#10140a}
.rot.nuc{flex-direction:column;gap:0;min-width:128px;padding:7px 14px;color:#fff;text-align:center;font:italic 600 var(--fn,20px)/1.05 var(--k-titulo);font-variation-settings:"SOFT" 100,"WONK" 1;background:radial-gradient(closest-side,#07051cdb 0,#07051cb8 62%,#07051c00 100%);transform:translate(-50%,-50%);white-space:nowrap}
.rot.nuc .num{width:auto;height:auto;box-shadow:none;background:none;font-size:.72em;color:var(--pale);font-weight:500}
.rot.nuc:hover .num,.rot.nuc.on .num{box-shadow:none;color:#fff}

/* Celular e janelas estreitas: célula alta, com rolagem */
html.alto .abertura{position:relative;left:auto;top:auto;padding:calc(var(--k-topo-h) + 16px) 16px 0;text-align:center}
html.alto .abertura h1{font-size:clamp(33px,10.2vw,58px);white-space:normal}
html.alto .abertura h1 br{display:none}
html.alto .corpo{width:auto;max-width:560px;margin:6px auto 0}
html.alto .corpo p{font-size:16px;margin-bottom:11px}
html.alto #continuar{min-height:52px;max-width:440px;margin:0 auto;justify-content:center;font-size:clamp(14.5px,4.1vw,16px)}
html.alto .bancada{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;padding:12px 16px 0;max-width:592px;margin:0 auto}
html.alto .plaquinha{position:relative;left:auto;bottom:auto;flex:none;transform:rotate(-.8deg)}
html.alto .dica{position:static;flex:1 1 84px;width:auto;max-width:240px;font-size:13.5px}
html.alto .rot{white-space:normal;background:#070615b0;padding:4px 12px 4px 4px;font-size:16px;line-height:1.18;width:max-content;max-width:var(--lrot,160px)}
html.alto .rot.esq{padding:4px 4px 4px 12px}
html.alto .rot.atual{background:var(--lim);padding:5px 12px 5px 5px}
html.alto .rot.atual.esq{padding:5px 5px 5px 12px}
html.alto .rot.nuc{background:radial-gradient(closest-side,#07051cdb 0,#07051cb8 62%,#07051c00 100%);max-width:none;padding:8px 14px;font-size:24px}
html.alto body.foco .plaquinha{position:fixed;z-index:56;left:8px;top:calc(var(--k-topo-h) + 8px);margin:0;transform:scale(.72) rotate(-1.3deg);transform-origin:0 0}

/* Durante o aumento, o mapa sai da frente */
.abertura h1,.corpo,.dica{transition:opacity .3s}
body.foco .abertura h1,body.foco .corpo,body.foco .dica,body.foco .rot{opacity:0!important;pointer-events:none!important}
body.foco .alvo,body.foco .plaquinha{pointer-events:none}
html:not(.pronto) .abertura h1,html:not(.pronto) .corpo,html:not(.pronto) .dica,html:not(.pronto) .plaquinha{opacity:0}

/* Campo claro (botão Dia): a lâmina fica iluminada, as asas seguem escuras */
html.lampada.alto .abertura h1{color:#1b1640;text-shadow:none}
html.lampada.alto .corpo p,html.lampada.alto .dica{color:#2a2548}
html.lampada.alto .rot{background:#15122ee8}
html.lampada.alto .rot.atual{background:var(--lim)}
html.lampada .rot.nuc,html.lampada.alto .rot.nuc{color:#1b1640;background:radial-gradient(closest-side,#fffffff0 0,#ffffffc4 62%,#fff0 100%)}
html.lampada .rot.nuc .num,html.lampada .rot.nuc:hover .num{color:#4b4570}

.k-nav button,.k-bt{min-height:44px}
.k-troca a{min-width:44px;height:44px}

/* Painel e aula */
.k-veu{background:linear-gradient(90deg,#0000 0 40%,#0000008c 100%);touch-action:none}
.k-painel{--k-acento:var(--cor-painel,#c9ff3a);border-left:1px solid #ffffff1f;background:linear-gradient(180deg,color-mix(in srgb,var(--cor-painel,#c9ff3a) 12%,#100d24) 0,#100d24 180px)}
.k-painel::before{content:"";flex:none;height:3px;background:var(--cor-painel,#c9ff3a);box-shadow:0 0 18px var(--cor-painel,#c9ff3a)}
.k-painel h2{font-style:italic;font-weight:600;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 72;color:#fff}
.k-aulas{overscroll-behavior:contain}
.k-aulas .id{font-family:var(--k-texto);opacity:.72}
.k-aula{--k-acento:#b5137c;--k-acento-texto:#fff}
html[data-leitura="noite"] .k-aula{--k-acento:#c9ff3a;--k-acento-texto:#10140a}
.k-aula h1,.k-aula h2,.k-aula h3{font-weight:600;font-variation-settings:"SOFT" 100,"opsz" 72}
.k-aula h1{font-style:italic}
.k-aula{font-size:18.5px}
@media (max-width:980px){
  .k-painel{height:70%;border-left:0;overflow:hidden}
  .k-veu{background:linear-gradient(180deg,#0000 0 28%,#0000008c 100%)}
}
@media (prefers-reduced-motion:reduce){
  #continuar i,.pocos i.atual,.rot.atual{animation:none}
  .rot,html.solto .rot{transition:none}
}
</style>

      <button id="continuar" type="button"><i aria-hidden="true"></i><span>Continuar: Git e GitHub, do zero</span></button>
    </div>
  </section>
  <div class="bancada" id="bancada">
    <button class="plaquinha" id="plaquinha" type="button" aria-label="Lâmina 3 de 18, aumento de 400 vezes. Ir até o módulo 3, onde você está.">
      <span class="fosco"><strong>Lâmina 3 de 18</strong><span>aumento <b id="aum">400x</b></span></span>
      <span class="pocos" id="pocos"></span>
    </button>
    <p class="dica" id="dica"></p>
  </div>
  <ol id="lista" aria-label="Os 18 módulos do curso"></ol>
</main>

    const rr = (alto ? Math.hypot(W, H) * .62 : R * 1.04) * ir; c.arc(alto ? W / 2 : cx, alto ? H * .5 : cy, max(.5, rr), 0, TAU, true); c.fill('evenodd');
  }
  linhas();
  if (movimento || cam.t0) pede();
}

/* ---------- interação ---------- */
function ativa(n) {
  if (n === ativo) return; if (ativo >= 0) O[ativo].lab.classList.remove('on'); ativo = n; if (n >= 0) O[n].lab.classList.add('on'); pede();
}
lista.addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; const n = +b.dataset.n; ultimoBotao = O[n].lab; Kit.abrirModulo(n); });
lista.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const b = e.target.closest('[data-n]'); if (b) ativa(+b.dataset.n); });
lista.addEventListener('pointerout', e => { if (e.pointerType === 'touch') return; if (e.target.closest('[data-n]')) ativa(-1); });
lista.addEventListener('focusin', e => { const b = e.target.closest('.rot'); if (b && b.matches(':focus-visible')) ativa(+b.dataset.n); });
lista.addEventListener('focusout', () => ativa(-1));
if (matchMedia('(pointer:fine)').matches) { addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; }, { passive: true }); document.addEventListener('pointerleave', () => { mx = my = -1e5; }); }

function area() {
  const ph = painelEl.offsetHeight, band = W <= 980;
  return band ? { x: W / 2, y: topo + (innerHeight - ph - topo) / 2, w: W, h: innerHeight - ph - topo } : { x: (W - painelEl.offsetWidth) / 2, y: (topo + innerHeight) / 2, w: W - painelEl.offsetWidth, h: innerHeight - topo };
}
function focar(n, semPainel) {
  const o = O[n], A = semPainel ? { x: alto ? W / 2 : cx, y: alto ? innerHeight / 2 : cy, w: W, h: innerHeight - topo } : area();
  const des = alto ? min(W * .42, A.h * .56 / max(o.asp, .62)) : min(A.w, A.h) * .29;
  cam.Z = clamp(des / o.s, n === 17 && alto ? 1.1 : 1.25, 4); cam.n = n; cam.Fx = A.x; cam.Fy = A.y; cam.Lx = alto || semPainel ? cx : A.x; cam.de = cam.p; cam.para = 1; cam.t0 = performance.now();
  document.body.classList.add('foco'); lista.inert = true; corpoEl.inert = true; plaq.inert = true;
  o.poco.classList.add('olhando'); pede();
}
document.addEventListener('k-modulo', e => {
  const n = e.detail, o = O[n]; painelEl.style.setProperty('--cor-painel', HEX[o.cor]);
  focar(n);
});
document.addEventListener('k-fechar', () => {
  if (cam.n >= 0) O[cam.n].poco.classList.remove('olhando');
  document.body.classList.remove('foco'); lista.inert = false; corpoEl.inert = false; plaq.inert = false;
  cam.de = cam.p; cam.para = 0; cam.t0 = performance.now(); pede();
  ultimoBotao?.focus?.({ preventScroll: true });
});
document.addEventListener('k-noite', e => { P = e.detail ? PAL.noite : PAL.dia; html.classList.toggle('lampada', !e.detail); for (const o of O) o.e = {}; medeTudo(); lampT = performance.now(); });
$('#continuar').addEventListener('click', () => {
  ultimoBotao = $('#continuar');
  if (!movimento) { Kit.continuar(); return; }
  focar(ATUAL, true); cam.dur = .46;
  setTimeout(() => {
    Kit.continuar(); O[ATUAL].poco.classList.remove('olhando'); document.body.classList.remove('foco'); lista.inert = false; corpoEl.inert = false; plaq.inert = false;
    cam.t0 = 0; cam.p = 0; cam.para = 0; cam.n = -1; cam.dur = .72; tela.style.filter = '';
  }, 470);
});
plaq.addEventListener('click', () => { const o = O[ATUAL]; if (alto) scrollTo({ top: max(0, o.y - innerHeight * .46), behavior: movimento ? 'smooth' : 'auto' }); o.flash = 1; pede(); });
addEventListener('scroll', () => { if (!movimento) pede(); }, { passive: true });
let rzT = 0, ultW = 0, ultH = 0;
addEventListener('resize', () => {
  clearTimeout(rzT); rzT = setTimeout(() => { const w = html.clientWidth, h = innerHeight; if (alto && w === ultW && abs(h - ultH) < 170) return; ultW = w; ultH = h; medeTudo(); }, 120);
});
mov.addEventListener?.('change', e => { movimento = !e.matches; if (!movimento) tela.style.filter = ''; pede(); });

medeTudo(); ultW = W; ultH = innerHeight;
document.fonts?.ready?.then(() => { if (alto) { const a = yBanc, q = $('#bancada').getBoundingClientRect().bottom + scrollY; if (abs(a - q) > 1) medeTudo(); } else montaPC(); });
pede();
})();
