<style>
:root{
 --marinho:#06213c;--sol:#ffc93c;--boia:#ff6b86;--espuma:#f2fbff;--tinta:#06213c;
 --k-topo-fundo:#06213c;--k-topo-texto:#f2fbff;--k-acento:#e8375a;--k-acento-texto:#fff;
 --k-painel-fundo:#06213c;--k-painel-texto:#f2fbff;--k-linha:#1f4a6e;
 --k-titulo:'Shrikhand',Georgia,serif;--k-texto:'Barlow',system-ui,sans-serif;--k-raio:14px;
 --k-leitura-fundo:#f3fbfa;--k-leitura-texto:#0a2a3f;--k-leitura-caixa:#d9f1ee;
 --k-leitura-fundo-noite:#061a2e;--k-leitura-texto-noite:#e8f4f8;--k-leitura-caixa-noite:#0e2c47;
 --med:126px;--marg:3vw;--ala:min(560px,41vw);--arte-h:calc(var(--ala)*.75);--passo:clamp(440px,58vh,540px);
 --o1:#8fe9dc;--o2:#45d3cf;--o3:#14c8c6;--jw:clamp(170px,min(21vw,36vh),300px);--e0w:min(calc(var(--ala)*.62),38vh);--fw:min(780px,calc(100vw - var(--med) - 24px),86vh);
 font-synthesis:none;
}
html[data-leitura="noite"]{--tinta:#fff3d6;--o1:#1c6d8c;--o2:#128096;--o3:#0d8a9e}
.k-marca,.k-painel h2,.k-aula h1,.k-aula h2,.k-caixa h3,.k-aula-barra strong{font-weight:400}
.k-aula{font-size:18.5px}
.k-troca{-webkit-backdrop-filter:none;backdrop-filter:none;background:#000000e0}
html{background:#ff9a5b;-webkit-text-size-adjust:100%}
html.fundo-preto{background:#000}
body{margin:0;font-family:var(--k-texto);color:var(--espuma);overflow-x:hidden;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}

/* Céu */
.ceu{position:relative;overflow:hidden;box-sizing:border-box;min-height:max(62vh,360px);padding:calc(var(--k-topo-h,58px) + clamp(14px,4vh,40px)) calc(var(--med) + 14px) 104px clamp(18px,4vw,60px);background:linear-gradient(#ff7a59,#ffa25a 48%,#ffc873);color:var(--tinta);transition:color .8s}
.ceu::before{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(2px 2px at 26% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 38% 38%,#fff,transparent),radial-gradient(2px 2px at 52% 16%,#fff,transparent),radial-gradient(1.5px 1.5px at 63% 30%,#fff,transparent),radial-gradient(2px 2px at 76% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 8% 52%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 58%,#fff,transparent),linear-gradient(#041230,#0b2c5c 60%,#17508a);opacity:0;transition:opacity .8s}
html[data-leitura="noite"] .ceu::before{opacity:1}
.sol{position:absolute;right:calc(var(--med) + var(--marg) + var(--ala)/2 - min(50vw,470px)/2);bottom:-16%;width:min(50vw,470px);aspect-ratio:1;border-radius:50%;background:#fff0a3;box-shadow:0 0 0 clamp(16px,3vw,44px) #ffe58a59,0 0 0 clamp(36px,6.4vw,96px) #ffdc7a33;animation:nascer 1.3s cubic-bezier(.2,.9,.3,1) both;transition:background .8s,box-shadow .8s}
html[data-leitura="noite"] .sol{background:#35588f;box-shadow:0 0 0 clamp(16px,3vw,44px) #ffffff12,0 0 0 clamp(36px,6.4vw,96px) #ffffff0a}
.nuvem{position:absolute;fill:#fff;opacity:.62;animation:deriva 70s linear infinite alternate}
.n1{top:66%;left:37%;width:clamp(90px,11vw,170px)}
.n2{top:76%;left:5%;width:clamp(70px,8vw,120px);animation-duration:95s;animation-direction:alternate-reverse;opacity:.5}
html[data-leitura="noite"] .nuvem{opacity:.12}
.pre .texto,.pre .jangada,.pre .medidor{visibility:hidden}
.texto{position:relative;z-index:5}
.titulo{margin:0;font:400 min(9.1vw,21vh)/1 var(--k-titulo);letter-spacing:-.005em}
.grupo{display:inline-block;white-space:nowrap}
.pal{display:inline-block}
.let{display:inline-block;animation:cair .8s cubic-bezier(.2,1.5,.35,1) both,boiar 6s ease-in-out infinite;animation-delay:calc(var(--i)*36ms),calc(1.1s + var(--i)*170ms)}
.frase{margin:.5em 0 0;max-width:38em;font-size:clamp(18px,1.65vw,24px);line-height:1.3;font-weight:500}
.acoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(12px,2.2vh,22px)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border:0;border-radius:30px;font:600 clamp(16px,1.25vw,18px)/1.1 var(--k-texto);cursor:pointer;transition:transform .14s,box-shadow .14s;touch-action:manipulation}
.bt:active{transform:translateY(3px)}
.bt-cont{background:var(--marinho);color:#fff;box-shadow:0 5px 0 #0003}
.bt-merg{background:#fff;color:var(--marinho);box-shadow:0 5px 0 var(--marinho)}
.bt-merg:active{box-shadow:0 2px 0 var(--marinho)}
.bt-merg svg{flex:none}
.boia-ic{transition:transform .5s}
.seta{animation:quica 1.5s ease-in-out infinite}
html[data-leitura="noite"] .bt-cont{background:var(--sol);color:var(--marinho)}
.ceu :focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
.jangada{position:absolute;z-index:2;right:calc(var(--med) + var(--marg) + var(--ala)/2 - var(--jw)/2);bottom:clamp(2px,1vh,10px);width:var(--jw);transform-origin:50% 92%;animation:chegar 1.5s cubic-bezier(.2,.8,.3,1) both,balanco 5.2s ease-in-out 1.5s infinite}
.onda{position:absolute;left:0;bottom:-1px;width:200%;height:clamp(46px,8vh,78px);animation:vaga 20s linear infinite;pointer-events:none}
.onda path{transition:fill .8s}
.onda.o1{z-index:1;height:clamp(62px,10.5vh,104px);animation-duration:27s}
.onda.o2{z-index:2;height:clamp(50px,8.5vh,84px);animation-duration:17s;animation-direction:reverse}
.onda.o3{z-index:3;height:clamp(32px,5.2vh,52px);animation-duration:11s}

/* Oceano */
.oceano{position:relative;min-height:40vh;overflow:hidden;overflow:clip;background:linear-gradient(#14c8c6,#0a4785 30%,#061433 70%,#000)}
.oceano::before{content:"";position:absolute;inset:0 0 auto;height:1700px;background:linear-gradient(#041a3559,#041a35cc 16%,#041a3500);opacity:0;transition:opacity .8s;pointer-events:none}
html[data-leitura="noite"] .oceano::before{opacity:1}
.raios{position:absolute;inset:0 0 auto;height:min(1700px,200vh);overflow:hidden;pointer-events:none}
.raio{position:absolute;top:0;height:100%;left:var(--x);width:var(--l);background:linear-gradient(#fff0,#ffffff75 9%,#fff0 92%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);transform:skewX(var(--s));transform-origin:50% 0;animation:raio var(--d) ease-in-out infinite alternate}
.convite{position:absolute;z-index:5;left:clamp(18px,4vw,60px);top:clamp(178px,22vh,206px);display:flex;align-items:center;gap:8px;color:var(--marinho);font-weight:600;font-size:17px;pointer-events:none}
html[data-leitura="noite"] .convite{color:#fff}
#estacoes{margin:0;padding:0;list-style:none}
.estacao{position:relative;height:var(--passo)}
.conj{position:absolute;top:0;width:var(--ala)}
.dir .conj{right:calc(var(--med) + var(--marg))}
.esq .conj{left:var(--marg)}
.alvo{display:block;position:relative;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation;scroll-margin:110px 0 100px}
.arte{display:block;position:relative;z-index:1;transition:opacity .55s}
.arte svg{display:block;width:100%;height:auto;overflow:visible}
.futuro .arte{opacity:.36}
.futuro.perto .arte,.alvo:focus-visible .arte{opacity:1}
.oceano :focus-visible{outline:3px solid #fff;outline-offset:3px}
.alvo:focus-visible{outline:0}
.placa{position:absolute;z-index:5;left:50%;bottom:-9%;display:flex;align-items:center;gap:12px;box-sizing:border-box;width:max-content;max-width:100%;min-height:66px;padding:8px 22px 8px 9px;border-radius:40px;background:var(--pf);color:var(--pt);box-shadow:0 6px 0 var(--ps),0 16px 26px #0006;transform:translateX(-50%);transition:transform .14s,box-shadow .14s,outline-color .3s}
.alvo:active .placa{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 var(--ps)}
.alvo:focus-visible .placa{outline:3px solid #fff;outline-offset:4px;box-shadow:0 6px 0 var(--ps),0 0 0 8px var(--marinho)}
.feito{--pf:var(--sol);--pt:var(--marinho);--ps:#b57e00;--nf:var(--marinho);--nt:var(--sol)}
.atual{--pf:var(--boia);--pt:var(--marinho);--ps:#a51f3f;--nf:var(--marinho);--nt:#fff}
.futuro{--pf:#0b2f52;--pt:#fff;--ps:#02101f;--nf:#134a78;--nt:#fff}
.futuro .placa{outline:2px solid #4fb3d9;outline-offset:-2px}
.futuro.perto .placa{outline-color:#c9f4ff}
.num{position:relative;flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--nf);color:var(--nt);font:700 22px/1 'Barlow Semi Condensed',var(--k-texto)}
.atual .num::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--marinho);animation:ping 1.8s ease-out infinite}
.nome{display:block;font:400 clamp(22px,2.05vw,29px)/1.1 var(--k-titulo);text-wrap:balance}
.meta{display:block;margin-top:3px;font:600 15.5px/1.2 'Barlow Semi Condensed',var(--k-texto)}
.bandeira{position:absolute;left:30px;bottom:calc(100% - 7px);width:38px;height:54px;overflow:visible;transform-origin:14% 100%;animation:tremula 3s ease-in-out infinite}
.sonar{position:absolute;z-index:1;left:50%;top:44%;width:96%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.sonar i{position:absolute;inset:0;border-radius:50%;border:3px solid #fff;opacity:0;animation:sonar 3.2s ease-out infinite}
.sonar i:nth-child(2){animation-delay:1.06s}
.sonar i:nth-child(3){animation-delay:2.12s}
.estacao:not(.visivel) .num::after{animation-play-state:paused}
.anim{animation-play-state:paused!important}
.visivel .anim,.visivel .anim *{animation-play-state:running!important}
.anim *{animation-play-state:paused}
.luz .pisca,.oceano:not(.luz) .pisca2{opacity:.15}
.faisca{position:absolute;left:var(--x);top:var(--y);width:var(--t);aspect-ratio:1;margin:calc(var(--t)/-2) 0 0 calc(var(--t)/-2);background:var(--c,#fff);clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);animation:brilho 2.4s ease-in-out infinite}
.bt-aqui{position:absolute;z-index:5;left:50%;top:calc(109% + 18px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - var(--med) - 16px);background:#fff;color:var(--marinho);box-shadow:0 5px 0 var(--marinho)}
.bt-aqui:active{transform:translateX(-50%) translateY(3px)}
.chao{position:absolute;z-index:1;top:calc(var(--arte-h)*.875);height:clamp(150px,20vh,210px);pointer-events:none}
.esq .chao{left:0;width:calc(var(--marg) + var(--ala)*1.02)}
.dir .chao{right:0;width:calc(var(--med) + var(--marg) + var(--ala)*1.02);transform:scaleX(-1)}
.chao svg{display:block;width:100%;height:100%}

/* Estação zero, pendurada na jangada */
.e0{height:calc(var(--passo)*.92)}
.e0 .conj{right:calc(var(--med) + var(--marg) + (var(--ala) - var(--e0w))/2);width:var(--e0w);top:6px}
.e0 .placa{left:auto;right:84%;bottom:24%;transform:none;max-width:none}
.e0 .alvo:active .placa{transform:translateY(4px)}

/* Tesouro */
.final{height:auto;padding-top:60px;padding-bottom:0}
.final .conj{position:relative;margin:0 auto;left:calc(var(--med)/-2);width:var(--fw)}
.final .placa{position:relative;left:auto;bottom:auto;margin:-14px auto 0;min-height:76px;transform:none}
.final .alvo:active .placa{transform:translateY(4px)}
.final .nome{font-size:clamp(28px,3vw,40px)}
.clarao{position:absolute;z-index:0;left:50%;top:40%;width:130%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,#ffd97ab0,#ffb34740 45%,#ffb34700);pointer-events:none}
.giro{position:absolute;z-index:0;left:50%;top:40%;width:120%;aspect-ratio:1;margin:-60% 0 0 -60%;border-radius:50%;background:repeating-conic-gradient(#ffe9a826 0 9deg,#ffe9a800 9deg 30deg);-webkit-mask:radial-gradient(closest-side,#000 25%,#0000);mask:radial-gradient(closest-side,#000 25%,#0000);animation:gira 60s linear infinite;pointer-events:none}
.leito{position:absolute;z-index:1;left:0;bottom:0;width:100%;height:calc(170px + 19vh)}
.fim-acoes{position:relative;z-index:5;display:flex;justify-content:center;left:calc(var(--med)/-2);padding:30px 0 104px}
.bt-subir{background:#fff;color:var(--marinho);box-shadow:0 5px 0 #6d7d8c}

/* Medidor */
.medidor{position:fixed;z-index:10;right:8px;top:calc(var(--k-topo-h) + 10px);bottom:72px;max-height:886px;width:calc(var(--med) - 16px);display:flex;flex-direction:column;overflow:hidden;contain:layout paint;border-radius:22px;background:#041a30e0;box-shadow:0 0 0 2px #ffffff30,0 10px 30px #0005;color:#e9f7fb;font:600 14px/1 'Barlow Semi Condensed',var(--k-texto)}
.leitura{flex:none;display:flex;align-items:baseline;justify-content:center;gap:3px;padding:10px 4px 9px;background:#021122;color:var(--sol);font-size:24px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.leitura small{font-size:15px;color:#e9f7fb}
.fita{position:relative;flex:1;min-height:0;margin:0;padding:0;list-style:none;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.fita::-webkit-scrollbar{display:none}
.fita::before,.fita::after{content:"";position:absolute;right:33px;top:22px;width:2px}
.fita::before{height:calc(18*44px);background:#ffffff4d}
.fita::after{height:calc(4*44px);background:var(--sol)}
.marca{position:relative;z-index:1;display:flex;align-items:center;justify-content:flex-end;width:100%;height:44px;padding:0 24px 0 2px;gap:7px;border:0;background:none;color:inherit;font:inherit;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.marca:focus-visible{outline-color:#fff;outline-offset:-3px}
.ic{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%}
.m-futuro .ic::before{content:"";width:10px;height:10px;border-radius:50%;background:#041a30;box-shadow:0 0 0 2px #b9d7e6}
.m-atual .ic{position:relative}
.m-atual .ic::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--boia)}
.m-atual .ic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--boia);animation:ping 1.8s ease-out infinite}
.m-atual{color:#fff}
.m-feito .ic svg,.m-sup .ic svg,.m-fim .ic svg{display:block;width:20px;height:20px}
.ponteiro{position:absolute;z-index:2;right:1px;top:-7px;width:24px;height:15px;pointer-events:none;will-change:transform}
#dica{position:fixed;z-index:11;right:calc(var(--med) + 2px);max-width:300px;padding:9px 13px;border-radius:12px;background:var(--marinho);color:#fff;box-shadow:0 0 0 2px #ffffff40;font:500 16px/1.2 var(--k-texto);white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(-50%);transition:opacity .12s}
#dica.on{opacity:1}
#fundo,#vida{position:fixed;left:0;top:0;pointer-events:none}
#fundo{z-index:0}
#vida{z-index:3}

@keyframes nascer{from{transform:translateY(34%)}to{transform:none}}
@keyframes deriva{from{transform:translateX(-5vw)}to{transform:translateX(7vw)}}
@keyframes cair{from{transform:translateY(-.9em) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes boiar{0%,100%{transform:none}50%{transform:translateY(.05em) rotate(1.2deg)}}
@keyframes quica{0%,100%{transform:translateY(-2px)}50%{transform:translateY(4px)}}
@keyframes chegar{from{transform:translateX(34vw) rotate(5deg)}to{transform:none}}
@keyframes balanco{0%,100%{transform:rotate(-2.6deg) translateY(2px)}50%{transform:rotate(2.8deg) translateY(-5px)}}
@keyframes vaga{to{transform:translateX(-50%)}}
@keyframes raio{from{opacity:.28}to{opacity:.95}}
@keyframes ping{from{transform:scale(.8);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes tremula{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.5deg)}}
@keyframes sonar{from{transform:scale(.2);opacity:.9}to{transform:scale(1);opacity:0}}
@keyframes brilho{0%,100%{transform:scale(.25);opacity:.2}50%{transform:scale(1);opacity:1}}
@keyframes gira{to{transform:rotate(360deg)}}
.parado *,.parado::before{animation-play-state:paused!important}

@media (hover:hover){
 .bt:hover{transform:translateY(-2px)}
 .bt-aqui:hover{transform:translateX(-50%) translateY(-2px)}
 .bt-merg:hover .boia-ic{transform:rotate(180deg)}
 .marca:hover{background:#ffffff24}
 .alvo:hover .arte{opacity:1}

 .e0 .alvo:hover .placa,.final .alvo:hover .placa{transform:translateY(-3px)}
}

 .e0 .placa{right:auto;left:50%;bottom:-36%;transform:translateX(-50%)}

 .e0 .alvo:active .placa{transform:translateX(-50%) translateY(4px)}
 .e0{height:calc(var(--passo) + 30px)}
}
@media (max-width:760px){
 :root{--med:58px;--ala:min(340px,calc(100vw - var(--med) - 14px));--passo:calc(var(--ala)*.75 + 150px);--jw:clamp(128px,40vw,170px)}
 .ceu{padding:calc(var(--k-topo-h) + 14px) var(--med) calc(var(--jw)*.88 + 6px) 16px;min-height:0}
 .titulo{font-size:min(15.2vw,72px);line-height:1.02}
 .frase{font-size:18px;margin-top:.35em}
 .acoes{gap:10px;margin-top:12px}
 .bt{min-height:50px;padding:0 18px;font-size:16px}
 .sol{width:64vw;right:calc(var(--med) + (100vw - var(--med))/2 - 32vw);bottom:-14vw}
 .jangada{right:calc(var(--med) + (100vw - var(--med))/2 - var(--jw)/2)}
 .n1,.n2{display:none}
 .conj,.dir .conj,.esq .conj{left:calc((100vw - var(--med))/2 - var(--ala)/2);right:auto}
 .placa{position:relative;left:auto;bottom:auto;margin:-16px auto 0;transform:none;width:100%;min-height:68px}
 .alvo:active .placa{transform:translateY(4px)}
 .nome{font-size:24px}
 .chao{top:calc(var(--arte-h)*.82);height:150px}
 .esq .chao{width:92%}
 .dir .chao{width:92%}
 .e0{height:calc(var(--ala)*.5 + 190px)}
 .e0 .conj{left:calc((100vw - var(--med))/2 - var(--ala)/2);right:auto;width:var(--ala);top:0}
 .e0 .arte{width:56%;margin:0 auto}
 .alvo:hover .placa{transform:translateY(-3px)}
 .bt-aqui:hover{transform:translateY(-2px)}
 .e0 .placa{right:auto;bottom:auto;max-width:100%;margin-top:2px}
 .e0 .bandeira{left:auto;right:34px}
 .bt-aqui{position:relative;display:flex;left:auto;top:auto;transform:none;width:100%;box-sizing:border-box;margin-top:14px}
 .bt-aqui:active{transform:translateY(3px)}
 .e3{height:calc(var(--passo) + 62px)}
 .final{padding-top:30px}
 .final .conj{width:calc(100vw - var(--med) - 10px);left:calc(var(--med)/-2)}
 .final .placa{width:calc(100% - 20px)}
 .final .nome{font-size:30px}

   if (o.f === abissal && cel) xc = (W - med) * .3;
   const ac = o.f === abissal ? clamp(1 - hypot(xc - lampX, yc - lampY) / 520, 0, 1) * brilhoF : 0;
   g.save(); g.translate(xc, yc); g.scale(flip * e, e); o.f(o, t, ac); g.restore();
  }

  /* Neve marinha: quase invisível, acende dentro do facho */
  if (k > 3.5 && !leve) {
   const n0 = clamp((k - 3.5) / 4, 0, 1);
   g.fillStyle = '#eaf6ff';
   for (const n of neve) {
    n.y += .12 * n.s - dy * n.p; n.x += sin(t * .3 + n.y * .01) * .08;
    if (n.y < 0) n.y += H; else if (n.y > H) n.y -= H;
    const d = hypot(n.x - (lampX + 150 * dir), n.y - lampY);
    g.globalAlpha = n0 * (.16 + clamp(1 - d / 260, 0, 1) * .75 * brilhoF);
    g.fillRect(n.x, n.y, 1.7 * n.s, 1.7 * n.s);
   }
   g.globalAlpha = 1;
  }

  /* Bolhas: saem da hélice conforme a velocidade */
  if (!calmo.matches) {
   if (abs(velS) > .25 && rnd() < clamp(abs(velS) * .5, 0, .9)) novaBolha(xSub - cos(ang) * 78 * esc * fs, ySubV + (rnd() - .5) * 18, 1.6 + rnd() * 4);
   else if (rnd() < .02) novaBolha(xSub - 80 * esc * fs, ySubV, 1.5 + rnd() * 3);
   if (k < 2.5 && rnd() < .03) novaBolha(rnd() * W, H + 8, 1.5 + rnd() * 4.5);
   g.lineWidth = 1.3;
   for (let i = bol.length - 1; i >= 0; i--) {
    const b = bol[i]; b.y -= b.v * (dt / 16) * 1.6 + dy; b.x += sin(t * 2 + b.f) * .25;
    if (b.y < -10 || b.y > H + 60 || (yw > 0 && b.y < yw)) { bol.splice(i, 1); continue; }
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.fillStyle = 'rgba(255,255,255,.16)';
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.fill(); g.stroke();
   }
  }

  /* Facho */
  if (brilhoF > .02) {
   g.save(); g.translate(lampX, lampY); g.scale(dir, 1); g.rotate(inclFeixe * 1);
   g.globalCompositeOperation = 'lighter'; g.globalAlpha = brilhoF * lerp(.62, .95, clamp((k - 3) / 6, 0, 1));
   const fl = cel ? 330 : 500; g.drawImage(FEIXE, 0, -fl * .25, fl, fl * .5);
   g.restore();
   luz(3, lampX, lampY, 46 * esc, brilhoF);
  }

  /* O submarino */
  helice += (.22 + abs(velS) * .9) * (dt / 16);
  g.save(); g.translate(xSub, ySubV); g.scale(fs * esc, esc); g.rotate(ang);
  g.fillStyle = '#06213c'; g.beginPath(); g.ellipse(-74, 0, 4, 22 * abs(cos(helice)) + 2, 0, 0, TAU); g.fill();
  g.fillStyle = '#ffe58a'; g.beginPath(); g.ellipse(-74, 0, 2, 19 * abs(cos(helice)) + 1, 0, 0, TAU); g.fill();
  g.drawImage(SUB, -90, -76, 180, 130);
  const pisc = (t % 4.3) < .13;
  g.fillStyle = '#f2b98a'; g.beginPath(); g.arc(26, -3, 12, 0, TAU); g.fill();
  g.fillStyle = '#06213c'; g.strokeStyle = '#06213c'; g.lineWidth = 2; g.lineCap = 'round';
  if (pisc) { g.beginPath(); g.moveTo(19, -6); g.lineTo(24, -6); g.moveTo(29, -6); g.lineTo(34, -6); g.stroke(); }
  else { g.beginPath(); g.arc(22, -6, 2.3, 0, TAU); g.arc(31, -6, 2.3, 0, TAU); g.fill(); }
  g.beginPath(); g.arc(26.5, -1, 5.5, .25, PI - .25); g.stroke();
  if (cel) { g.fillStyle = '#06213c'; g.beginPath(); g.arc(44, 31, 7, 0, PI); g.fill(); }
  if (brilhoF > .02) { g.globalAlpha = brilhoF; g.fillStyle = '#fff7cf'; g.beginPath(); if (cel) g.ellipse(44, 34, 5, 3, 0, 0, TAU); else g.ellipse(72.5, 6, 4, 8, 0, 0, TAU); g.fill(); g.globalAlpha = 1; }
  g.restore();

  /* Rótulo Você */
  const lx = xSub, ly = ySubV - 74 * esc - 16;
  g.font = "600 15px 'Barlow Semi Condensed',system-ui,sans-serif"; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.beginPath(); g.roundRect(lx - 28, ly - 12, 56, 24, 12); g.fill();
  g.beginPath(); g.moveTo(lx - 6, ly + 11); g.lineTo(lx, ly + 18); g.lineTo(lx + 6, ly + 11); g.fill();
  g.fillStyle = '#06213c'; g.fillText('Você', lx, ly + 1);

  g.restore();
 }

 /* Rolagem guiada: o botão e o medidor levam o submarino até a estação */
 let anima = 0;
 const pararAnima = () => { anima = 0; };
 function irPara(y, fim) {
  y = clamp(y, 0, maxY);
  const de = scrollY, d = abs(y - de);
  if (calmo.matches || d < 4) { scrollTo(0, y); if (calmo.matches) requestAnimationFrame(quadro); if (fim) fim(); return; }
  const dur = clamp(d * .28, 550, 1900), t0 = performance.now(), id = ++anima;
  const passo = now => {
   if (id !== anima) return;
   const p = min(1, (now - t0) / dur), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
   scrollTo(0, de + (y - de) * e);
   if (p < 1) requestAnimationFrame(passo); else if (fim) fim();
  };
  requestAnimationFrame(passo);
 }
 addEventListener('wheel', pararAnima, { passive: true });
 addEventListener('touchstart', pararAnima, { passive: true });
 addEventListener('keydown', e => { if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(e.key)) pararAnima(); });

 const continuar = () => irPara(pouso[Kit.ATUAL], () => setTimeout(() => Kit.continuar(), calmo.matches ? 0 : 420));
 $('#continuar').addEventListener('click', continuar);
 $('#mergulhar').addEventListener('click', () => irPara(pouso[1], () => alvos[1].focus({ preventScroll: true })));
 $('#subir').addEventListener('click', () => irPara(0, () => $('#mergulhar').focus({ preventScroll: true })));
 document.addEventListener('click', e => {
  const a = e.target.closest('.alvo'); if (a) { Kit.abrirModulo(+a.dataset.n); return; }
  if (e.target.closest('[data-continuar]')) { Kit.continuar(); return; }
  const m = e.target.closest('.marca'); if (!m) return;
  if (m.hasAttribute('data-sup')) irPara(0);
  else { const n = +m.dataset.n; irPara(pouso[n], () => alvos[n].focus({ preventScroll: true })); }
 });

 /* Dica com o nome no medidor */
 const mostrarDica = m => { if (!m) { dica.classList.remove('on'); return; } const r = m.getBoundingClientRect(); dica.textContent = m.dataset.dica; dica.style.top = r.top + r.height / 2 + 'px'; dica.classList.add('on'); };
 fita.addEventListener('mouseover', e => mostrarDica(e.target.closest('.marca')));
 fita.addEventListener('mouseenter', () => { sobreFita = true; });
 fita.addEventListener('mouseleave', () => { sobreFita = false; mostrarDica(null); });
 fita.addEventListener('focusin', e => { pausaFita = performance.now() + 2500; if (e.target.matches(':focus-visible')) mostrarDica(e.target); });
 fita.addEventListener('focusout', () => mostrarDica(null));
 ['wheel', 'touchstart', 'pointerdown'].forEach(n => fita.addEventListener(n, () => { pausaFita = performance.now() + 2000; }, { passive: true }));

 if (!calmo.matches) setInterval(() => oceano.classList.toggle('luz'), 620);

 /* Só o que está à vista anima */
 const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('visivel', e.isIntersecting)), { rootMargin: '120px 0px' });
 estacoes.forEach(e => io.observe(e));
 const ioP = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('parado', !e.isIntersecting)));
 ioP.observe($('#ceu')); ioP.observe($('#raios')); ioP.observe($('.convite'));

 /* Liga tudo */
 let rs = 0;
 const refazer = () => { medir(); if (calmo.matches) requestAnimationFrame(quadro); };
 addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => { refazer(); criarNeve(); }, 120); });
 document.fonts && document.fonts.ready.then(refazer);
 addEventListener('load', refazer);
 medir(); criarNeve();
 xSub = xIni; ySub = yIni; yAnt = yy = scrollY;
 bolhaInicial();
 if (calmo.matches) { addEventListener('scroll', () => requestAnimationFrame(quadro), { passive: true }); }
 calmo.addEventListener && calmo.addEventListener('change', () => location.reload());
 requestAnimationFrame(quadro);
})();
